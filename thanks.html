<style>
/* FaceBrand: deep petrol night, cream type, orange accent; one centered column, one question at a time */
@font-face{font-family:"Discovery FS";src:url(/discovery-fs.woff2) format("woff2") ;font-weight:100 900;font-display:swap}
:root{
  --bg:#0F1F26; --surface:rgba(253,241,214,.045); --surface-2:rgba(253,241,214,.08);
  --fg:#FDF1D6; --muted:rgba(253,241,214,.6); --faint:rgba(253,241,214,.38); --line:rgba(253,241,214,.12);
  --accent:#F2A93B; --accent-soft:rgba(242,169,59,.12); --on-accent:#0F1F26; --danger:#F08A78;
  --font:"Discovery FS",Heebo,Assistant,system-ui,sans-serif;
  color-scheme:dark;
}
html{direction:rtl;background:var(--bg)}
body{background-color:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(1200px 700px at 90% -10%,rgba(247,127,0,.14),transparent 55%),radial-gradient(1000px 600px at -10% 110%,rgba(247,226,181,.1),transparent 60%),radial-gradient(700px 400px at 50% 30%,rgba(14,90,90,.16),transparent 70%);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:580px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(15,31,38,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:14px;z-index:5;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
.back:hover{color:var(--fg)}
.back:disabled{visibility:hidden}
h1,h2{font-family:var(--font);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(34px,8vw,52px)} h2{font-size:clamp(24px,5.4vw,30px);line-height:1.25}
.hl{color:var(--accent)}
p{margin:0}
.lead{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:28px;background:var(--accent);opacity:.7}
.center{text-align:center;align-items:center}
.center .opts{align-self:stretch}
.wrap.mid{min-height:100svh;justify-content:center;padding-block:32px;box-sizing:border-box;gap:36px}
.wrap.mid .top{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding-block:0}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 20px;font-size:18px;line-height:1.45;color:var(--fg);transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:rgba(242,169,59,.55);background:var(--surface-2)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:16px 28px;font-size:18px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tag{font-size:14px;letter-spacing:.04em;color:var(--accent);font-weight:700}
.feel{display:flex;flex-direction:column;gap:14px;border-inline-start:2px solid var(--accent);padding-inline-start:18px;border-radius:0}
.feel p{font-size:clamp(20px,4.6vw,23px);line-height:1.5}
.meter{display:flex;flex-direction:column;gap:10px;margin-block:4px}
.mrow{display:grid;grid-template-columns:6.5em 1fr 3em;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.mrow b{font-variant-numeric:tabular-nums;text-align:left;font-weight:400}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.mfill{height:100%;background:var(--faint);border-radius:99px}
.mrow.hit{color:var(--fg)}
.mrow.hit b{font-weight:700}
.mrow.hit .mfill{background:var(--accent)}
.sub{font-size:clamp(20px,4.6vw,23px);color:var(--muted);line-height:1.45}
.ready{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ready b{font-weight:700;font-size:clamp(48px,11vw,64px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ready span{font-size:17px;flex:1;min-width:12em;color:var(--fg)}
.sub.hl{color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:flex;gap:14px;padding-block:14px;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;inset-inline-start:15px;top:48px;bottom:-14px;width:1px;background:var(--line)}
.dot{flex:none;width:31px;height:31px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);background:var(--bg);position:relative;z-index:1}
.sbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead b{font-size:19px}
.sbody p{font-size:17px;line-height:1.5}
.check{color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:14px}
.lyr{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.lyr.hit{border-color:rgba(242,169,59,.55);background:linear-gradient(180deg,rgba(242,169,59,.08),rgba(242,169,59,.02))}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lhead b{font-size:21px}
.lnum{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.lyr.hit .lnum{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.lyr.hit .lhead b{color:var(--accent)}
.lyr .pill{margin-inline-start:auto}
.lyr.some .pill,.lyr.quiet .pill{background:rgba(253,241,214,.06);color:var(--muted);border-color:var(--line)}
.lblock{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.said{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.said li{font-size:17px;line-height:1.45}
.quote{font-size:clamp(20px,4.6vw,23px);line-height:1.45}
.flow{display:flex;align-items:stretch;gap:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.node b{font-size:19px}
.node p{font-size:15px;line-height:1.5;color:var(--muted)}
.node.hit{border-color:var(--accent);background:var(--accent-soft)}
.node.hit b{color:var(--accent)}
.arrow{flex:none;width:26px;display:grid;place-items:center}
.arrow::before{content:"";width:9px;height:9px;border-top:1.5px solid var(--faint);border-left:1.5px solid var(--faint);transform:rotate(-45deg)}
@media (max-width:620px){.flow{flex-direction:column}.arrow{width:auto;height:26px}.arrow::before{transform:rotate(-135deg)}}
.rec{display:flex;flex-direction:column;gap:6px;background:rgba(253,241,214,.05);border-radius:16px;padding:16px 18px}
.rec .tag:not(:first-child){margin-top:10px}
.qs{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.qs li::marker{color:var(--accent);font-weight:700}
.book{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-block:28px 8px;border-top:1px solid var(--line)}
.book .free{align-self:center}
.gets-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.book .gets{align-items:flex-start;text-align:start}
.mantra{font-size:clamp(22px,5vw,27px);font-weight:700;line-height:1.3}
.formbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.formbox form{text-align:start}
.disclaimer{font-size:14px;color:var(--faint);line-height:1.55}
.pill{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(242,169,59,.4);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.step.hit .dot{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.step.hit .shead b{color:var(--accent)}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.link{border-radius:14px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);min-width:0}
.lname{font-size:16px;font-weight:700;line-height:1.25}
.lstat{font-size:14px;color:var(--muted);line-height:1.3}
.link.ok{background:rgba(253,241,214,.08)}
.link.mid{background:rgba(253,241,214,.04)}
.link.hit{border-color:var(--accent);background:var(--accent-soft)}
.link.hit .lstat{color:var(--accent);font-weight:700}
.link{justify-content:center}
.link:not(.hit){color:var(--muted);background:rgba(253,241,214,.04)}
.free{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(242,169,59,.4);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700}
.gets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gets li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.gets li::before{content:"✓";color:var(--accent);font-weight:700;flex:none}
.track.big{height:14px}
.mfill.done{background:var(--accent)}
.cta{border-color:rgba(242,169,59,.45);background:linear-gradient(180deg,rgba(242,169,59,.10),rgba(242,169,59,.03))}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:inherit;font-size:18px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(15,31,38,.6);color:var(--fg)}
input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--danger);font-size:14px;min-height:1em}
.note{font-size:13px;color:var(--faint);text-align:center}
.screen{display:flex;flex-direction:column;gap:24px}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .35s ease}@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
